<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imperfect Repairs — Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Schibsted+Grotesk:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#stage">Skip to archive</a>

  <header class="top">
    <div class="top-row">
      <h1>Imperfect Repairs</h1>
      <span class="crumb">Photographic archive of urban repairs</span>
    </div>

    <div class="toolbar">
      <div class="group" id="f-type" role="group" aria-label="Type filter">
        <span class="lbl">Type</span>
      </div>
      <div class="group" id="f-material" role="group" aria-label="Material filter">
        <span class="lbl">Material</span>
      </div>
      <div class="group" role="group" aria-label="Arrange">
        <span class="lbl">View</span>
        <button class="opt" data-arrange="type" aria-pressed="true">By type</button>
        <button class="opt" data-arrange="material" aria-pressed="false">By material</button>
        <button class="opt" data-arrange="index" aria-pressed="false">Index</button>
      </div>
    </div>
  </header>

  <main class="stage" id="stage" tabindex="-1" aria-label="Archive field">
    <div class="world" id="world">
      <div class="sheet" id="sheet" aria-hidden="true">
        <i class="crop tl"></i><i class="crop tr"></i><i class="crop bl"></i><i class="crop br"></i>
        <div class="running">
          <span>Imperfect Repairs</span>
          <em id="sheet-title">Plates, arranged by type</em>
          <span id="sheet-count"></span>
        </div>
      </div>
    </div>

    <p class="empty" id="empty" hidden>No photographs match. Turn a filter back on above.</p>

    <div class="hud">
      <span class="count" id="count" aria-live="polite"></span>
      <span class="hint">Drag to move · Ctrl-scroll or pinch to zoom · Click a photograph to open</span>
      <div class="zoom">
        <button id="z-out" aria-label="Zoom out">−</button>
        <span id="z-level">100%</span>
        <button id="z-in" aria-label="Zoom in">+</button>
        <button id="z-reset">Fit</button>
      </div>
    </div>
  </main>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="v-title" hidden>
    <figure class="v-fig" id="v-fig"></figure>
    <div class="v-side">
      <div class="v-bar">
        <span id="v-pos"></span>
        <div class="v-nav">
          <button id="v-prev" aria-label="Previous photograph">←</button>
          <button id="v-next" aria-label="Next photograph">→</button>
          <button id="v-close" aria-label="Close">Close</button>
        </div>
      </div>
      <div class="v-body" id="v-body">
        <span class="v-id reveal" id="v-id"></span>
        <h2 class="reveal" id="v-title"></h2>
        <dl class="v-meta reveal" id="v-meta"></dl>
        <p class="v-note reveal" id="v-note"></p>
      </div>
    </div>
  </div>

  <script src="Js/images.js"></script>
  <script src="Js/data.js"></script>
  <script src="Js/main.js"></script>
</body>
</html>
